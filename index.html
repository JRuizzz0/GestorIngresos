<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Ahorros y Finanzas</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mi Gestor Financiero</h1>
        </header>

        <section class="dashboard">
            <div class="card balance">
                <h3>Saldo Actual (Lo que puedes gastar)</h3>
                <p id="total-balance">0.00 €</p>
            </div>
            <div class="card incomes">
                <h3>Ingresos Totales</h3>
                <p id="total-incomes">0.00 €</p>
            </div>
            <div class="card expenses">
                <h3>Gastos Totales</h3>
                <p id="total-expenses">0.00 €</p>
            </div>
        </section>

        <div class="main-content">
            <section class="transactions-section">
                <h2>Añadir Movimiento</h2>
                <form id="transaction-form">
                    <input type="text" id="desc" placeholder="Descripción (ej. Nómina, Compra)" required>
                    <input type="number" id="amount" placeholder="Cantidad" step="0.01" required>
                    <select id="type">
                        <option value="income">Ingreso</option>
                        <option value="expense">Gasto</option>
                    </select>
                    <button type="submit">Guardar</button>
                </form>

                <h2>Historial</h2>
                <ul id="transaction-list"></ul>
            </section>

            <section class="goals-section">
                <h2>Metas de Ahorro</h2>
                <form id="goal-form">
                    <input type="text" id="goal-name" placeholder="Nombre de la meta (ej. PC Nuevo)" required>
                    <input type="number" id="goal-target" placeholder="Objetivo (€)" required>
                    <button type="submit">Añadir Meta</button>
                </form>
                <div id="goals-container"></div>
            </section>
        </div>
    </div>

    <script src="JS/app.js"></script>
</body>
</html>
